name: manage-db

on:
  workflow_dispatch:
    inputs:
      rematch_wrong:
        description: 'Re-verify existing DOIs (slow, hits Crossref for every matched item)'
        type: boolean
        default: false
  schedule:
  - cron: '0 0 1 * *'
    timezone: "America/Los_Angeles"

permissions:
  contents: read
  id-token: write
  pages: write

jobs:
  update-site:
    runs-on: ubuntu-latest

    env:
      UV_CACHE_DIR: /tmp/.uv-cache

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set-up s5cmd
        uses: peak/action-setup-s5cmd@main
        with:
          version: v2.3.0

      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0

      - name: Restore uv cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/.uv-cache
          key: uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: |
            uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
            uv-${{ runner.os }}

      - name: Restore S3 cache
        run: s5cmd --endpoint-url $AWS_ENDPOINT cp s3://ed-news-cache/ednews.db ednews.db
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.GARAGE_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.GARAGE_SECRET_KEY }}
          AWS_ENDPOINT: ${{ secrets.GARAGE_ENDPOINT }}
          AWS_DEFAULT_REGION: ${{ secrets.GARAGE_DEFAULT_REGION }}

      - name: Install dependencies
        run: uv sync

      - name: Run DB maintenance
        run: |
          uv run python main.py manage-db run-all --older-than-days 7
          if [ "${{ inputs.rematch_wrong }}" = "true" ]; then
            uv run ednews manage-db rematch-dois --reverify-dois
          fi
          uv run ednews manage-db rematch-dois --only-missing
          uv run ednews manage-db remove-feed-articles
          uv run python main.py manage-db fix-encoding

      - name: Upload ednews.db to S3 cache
        run: s5cmd --endpoint-url $AWS_ENDPOINT cp ednews.db s3://ed-news-cache/
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.GARAGE_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.GARAGE_SECRET_KEY }}
          AWS_ENDPOINT: ${{ secrets.GARAGE_ENDPOINT }}
          AWS_DEFAULT_REGION: ${{ secrets.GARAGE_DEFAULT_REGION }}

      - name: Minimize uv cache
        run: uv cache prune --ci
      
